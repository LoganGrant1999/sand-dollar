<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Test</title>
</head>
<body>
    <h1>OAuth Testing Page</h1>

    <h2>Test 1: Direct Links</h2>
    <a href="http://localhost:5173/oauth2/authorization/google" target="_blank">Test OAuth via localhost:5173</a><br><br>
    <a href="http://localhost:8080/oauth2/authorization/google" target="_blank">Test OAuth via localhost:8080</a><br><br>
    <a href="https://sanddollar.ngrok.app/oauth2/authorization/google" target="_blank">Test OAuth via ngrok</a><br><br>

    <h2>Test 2: JavaScript Navigation</h2>
    <button onclick="window.location.href = 'http://localhost:5173/oauth2/authorization/google'">
        JS Navigate to localhost:5173
    </button><br><br>

    <button onclick="window.location.href = '/oauth2/authorization/google'">
        JS Navigate with relative URL
    </button><br><br>

    <button onclick="console.log('Button clicked'); window.location.href = '/oauth2/authorization/google'">
        JS Navigate with console log
    </button><br><br>

    <h2>Test 3: Form Submission</h2>
    <form action="/oauth2/authorization/google" method="GET">
        <button type="submit">Form Submit to OAuth</button>
    </form><br>

    <h2>Test 4: Debug Information</h2>
    <button onclick="
        console.log('Current URL:', window.location.href);
        console.log('Target URL:', '/oauth2/authorization/google');
        console.log('About to navigate...');
        window.location.href = '/oauth2/authorization/google';
    ">Debug Navigate</button><br><br>

    <script>
        console.log('OAuth test page loaded');
        console.log('Current origin:', window.location.origin);
    </script>
</body>
</html>
