spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/sand_dollar}
    username: ${DB_USERNAME:sand_dollar_user}
    password: ${DB_PASSWORD:sand_dollar_password}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

feature:
  ai-budget-enabled: true

data-source-mode: plaid

jwt:
  secret: ${JWT_SECRET:demo-jwt-secret-key-for-development-only-not-for-production-use}
  expiration: ${JWT_EXPIRATION_MS:604800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  aiBudget:
    mockEnabled: false
  jwt:
    secret: ${JWT_SECRET:demo-jwt-secret-key-for-development-only-not-for-production-use}
    expires-in-seconds: 604800
