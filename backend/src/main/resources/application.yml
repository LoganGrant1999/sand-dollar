spring:
  application:
    name: sand-dollar

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sand_dollar}
    username: ${DB_USERNAME:sand_dollar_user}
    password: ${DB_PASSWORD:sand_dollar_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    # property-naming-strategy: SNAKE_CASE  # Commented out to use default camelCase
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
        provider:
          google:
            issuer-uri: https://accounts.google.com

logging:
  level:
    com.sanddollar: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.web: DEBUG

jwt:
  secret: ${JWT_SECRET:demo-jwt-secret-key-for-development-only-not-for-production-use}
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:2592000000}

app:
  jwt:
    secret: ${SD_JWT_SECRET}
    expires-in-seconds: 604800
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}

encryption:
  key: ${ENCRYPTION_KEY:}

plaid:
  client-id: ${PLAID_CLIENT_ID:}
  secret: ${PLAID_SECRET:}
  environment: ${PLAID_ENV:production}
  redirect-uri: ${PLAID_REDIRECT_URI:}

openai:
  api-key: ${OPENAI_API_KEY:}
  api.key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  max-tokens: ${OPENAI_MAX_TOKENS:2000}
  temperature: ${OPENAI_TEMPERATURE:0.3}
  connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:15000}
  read-timeout-ms: ${OPENAI_READ_TIMEOUT_MS:20000}
  max-retries: ${OPENAI_MAX_RETRIES:2}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}


refresh-token:
  secret: ${REFRESH_TOKEN_SECRET:demo-refresh-token-secret-for-development-only}

dev:
  auth-header: ${DEV_AUTH_HEADER:}

# Data Source Configuration
data-source-mode: ${DATA_SOURCE_MODE:mock}

feature:
  ai-budget-enabled: ${AI_BUDGET_ENABLED:true}
  ai-budget:
    rate-limit-per-minute: ${AI_BUDGET_RATE_LIMIT_PER_MINUTE:5}

server:
  port: 8080
  servlet:
    context-path: ""
    session:
      cookie:
        secure: true
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: 1MB
    max-http-form-post-size: 1048576
    max-http-header-size: 16834

---
spring:
  config:
    activate:
      on-profile: docker
      
  datasource:
    url: jdbc:postgresql://postgres:5432/sand_dollar
